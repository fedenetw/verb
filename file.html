<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  canvas { display: block; }

  #ui {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,10,.85) 30%);
    padding: 40px 20px 18px; display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: center; z-index: 10; pointer-events: none;
  }
  #ui > * { pointer-events: auto; }

  .btn {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    color: #fff; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    font-size: 13px; backdrop-filter: blur(8px); transition: all .2s;
  }
  .btn:hover { background: rgba(100,150,255,.25); border-color: rgba(120,170,255,.6); }
  .btn.active { background: rgba(80,140,255,.35); border-color: #6af; }

  .slider-group { display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06); padding: 8px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(8px); }
  .slider-group label { font-size: 12px; opacity: .8; white-space: nowrap; }
  input[type=range] { width: 160px; accent-color: #5b9dff; cursor: pointer; }
  #speedVal { font-size: 12px; min-width: 72px; color: #8fc3ff; font-variant-numeric: tabular-nums; }

  #dateDisplay {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,10,30,.5); border: 1px solid rgba(120,170,255,.25);
    padding: 8px 22px; border-radius: 12px; font-size: 14px; letter-spacing: .5px;
    backdrop-filter: blur(10px); z-index: 10; color: #cfe4ff;
    font-variant-numeric: tabular-nums;
  }

  #title {
    position: fixed; top: 18px; left: 22px; z-index: 10; pointer-events: none;
  }
  #title h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px;
    background: linear-gradient(90deg, #8fc3ff, #fff); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent; }
  #title p { font-size: 11px; opacity: .55; margin-top: 2px; letter-spacing: 1px; }

  #infoPanel {
    position: fixed; top: 0; right: -340px; width: 320px; height: 100%;
    background: linear-gradient(180deg, rgba(5,12,35,.92), rgba(10,5,25,.92));
    border-left: 1px solid rgba(120,170,255,.2);
    transition: right .4s cubic-bezier(.2,.9,.3,1); z-index: 20;
    padding: 30px 26px; backdrop-filter: blur(14px); overflow-y: auto;
  }
  #infoPanel.open { right: 0; }
  #infoClose {
    position: absolute; top: 14px; right: 14px; background: none; border: none;
    color: #88a; font-size: 22px; cursor: pointer;
  }
  #infoClose:hover { color: #fff; }
  #infoName { font-size: 26px; font-weight: 300; letter-spacing: 3px; margin: 6px 0 2px; }
  #infoType { font-size: 12px; opacity: .6; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
  .stat { display: flex; justify-content: space-between; padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px; }
  .stat .k { opacity: .6; } .stat .v { color: #a8ccff; text-align: right; }
  #infoFacts { margin-top: 20px; font-size: 13px; line-height: 1.7; opacity: .85; }
  #followBtn { margin-top: 22px; width: 100%; }

  #hint {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    font-size: 11px; opacity: .45; letter-spacing: 1px; z-index: 5; pointer-events: none;
    transition: opacity 1s;
  }
</style>
</head>
<body>

<div id="title"><h1>SOLAR SYSTEM</h1><p>drag to orbit · scroll to zoom · click a planet</p></div>
<div id="dateDisplay">J2000.0 — Jan 1, 2000</div>
<div id="hint">🖱 Click any planet or the Sun to explore it</div>

<div id="infoPanel">
  <button id="infoClose">✕</button>
  <div id="infoType"></div>
  <div id="infoName"></div>
  <div id="infoStats"></div>
  <div id="infoFacts"></div>
  <button class="btn" id="followBtn">🎥 Follow this planet</button>
</div>

<div id="ui">
  <button class="btn" id="pauseBtn">⏸ Pause</button>
  <div class="slider-group">
    <label>Time speed</label>
    <input type="range" id="speedSlider" min="-3" max="3" step="0.05" value="1.3">
    <span id="speedVal"></span>
  </div>
  <button class="btn active" id="orbitsBtn">Orbits</button>
  <button class="btn active" id="labelsBtn">Labels</button>
  <button class="btn" id="realScaleBtn">Real distances</button>
  <button class="btn" id="resetBtn">⟲ Reset view</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============ SCENE SETUP ============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 6000);
camera.position.set(0, 90, 190);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 2000;
controls.minDistance = 3;

scene.add(new THREE.AmbientLight(0x334, 0.6));
const sunLight = new THREE.PointLight(0xfff2cc, 2.2, 0, 2);
scene.add(sunLight);

// ============ STARFIELD ============
function makeStars(count, size, color) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 1800 + Math.random() * 1500;
    const t = Math.acos(2 * Math.random() - 1);
    const p = Math.random() * Math.PI * 2;
    pos[i*3]   = r * Math.sin(t) * Math.cos(p);
    pos[i*3+1] = r * Math.cos(t);
    pos[i*3+2] = r * Math.sin(t) * Math.sin(p);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color, size, sizeAttenuation: false }));
}
scene.add(makeStars(4000, 1.2, 0xffffff), makeStars(1500, 1.8, 0x99bbff), makeStars(800, 2.4, 0xffd9a0));

// ============ SUN ============
const sunGroup = new THREE.Group();
scene.add(sunGroup);
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(10, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffcc44 })
);
sunGroup.add(sun);

// glow sprite
function glowSprite(color, scale) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, color); g.addColorStop(0.35, color.replace(/[\d.]+\)$/, '0.35)'));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.scale.set(scale, scale, 1);
  return s;
}
sunGroup.add(glowSprite('rgba(255,190,80,1)', 60));
sunGroup.add(glowSprite('rgba(255,240,200,1)', 26));

// ============ PLANET DATA ============
// visual: compressed distances & sizes for beauty; real: true AU scale
const PLANETS = [
  { name:'Mercury', color:0x9c8a7a, size:1.6,  dist:20,  period:87.97,   rot:58.6,  tilt:0.03,
    type:'Terrestrial planet', realDist:0.387, facts:'The smallest planet — yet has a huge iron core. A year lasts only 88 days, but a single day-night cycle takes 176 Earth days.',
    stats:{ 'Diameter':'4,879 km','Day length':'58.6 Earth days','Year':'88 days','Distance from Sun':'57.9M km (0.39 AU)','Moons':'0','Avg temp':'167 °C (day)' } },
  { name:'Venus', color:0xe8c58f, size:2.9, dist:28, period:224.7, rot:-243, tilt:177,
    type:'Terrestrial planet', realDist:0.723, facts:'Spins backwards and slower than it orbits. Its thick CO₂ atmosphere creates a runaway greenhouse — hottest surface of any planet.',
    stats:{ 'Diameter':'12,104 km','Day length':'243 Earth days (retrograde)','Year':'225 days','Distance from Sun':'108.2M km (0.72 AU)','Moons':'0','Avg temp':'464 °C' } },
  { name:'Earth', color:0x4488cc, size:3.0, dist:38, period:365.25, rot:1, tilt:23.4,
    type:'Terrestrial planet', realDist:1.0, moon:true,
    facts:'The only known world with liquid surface water and life. 71% of its surface is ocean, and its magnetic field shields us from solar wind.',
    stats:{ 'Diameter':'12,742 km','Day length':'23.9 hours','Year':'365.25 days','Distance from Sun':'149.6M km (1 AU)','Moons':'1 (the Moon)','Avg temp':'15 °C' } },
  { name:'Mars', color:0xc0603c, size:2.0, dist:50, period:686.98, rot:1.03, tilt:25.2,
    type:'Terrestrial planet', realDist:1.524,
    facts:'Home to Olympus Mons, the tallest volcano in the solar system (2.5× Everest), and Valles Marineris, a canyon that would span the USA. Water ice confirmed at both poles.',
    stats:{ 'Diameter':'6,779 km','Day length':'24.6 hours','Year':'687 days','Distance from Sun':'227.9M km (1.52 AU)','Moons':'2 (Phobos, Deimos)','Avg temp':'−63 °C' } },
  { name:'Jupiter', color:0xd8a86e, size:8.5, dist:85, period:4332.6, rot:0.41, tilt:3.1,
    type:'Gas giant', realDist:5.203,
    facts:'More than twice the mass of all other planets combined. The Great Red Spot is a storm larger than Earth that has raged for at least 300 years.',
    stats:{ 'Diameter':'139,820 km','Day length':'9.9 hours','Year':'11.86 Earth years','Distance from Sun':'778.5M km (5.2 AU)','Moons':'95 known','Avg temp':'−108 °C' } },
  { name:'Saturn', color:0xe0c890, size:7.2, dist:115, period:10759, rot:0.45, tilt:26.7, ring:true,
    type:'Gas giant', realDist:9.537,
    facts:'Its magnificent rings span 280,000 km but are mostly less than a kilometre thick — made of billions of chunks of ice and rock.',
    stats:{ 'Diameter':'116,460 km','Day length':'10.7 hours','Year':'29.4 Earth years','Distance from Sun':'1.43B km (9.54 AU)','Moons':'146 known','Avg temp':'−139 °C' } },
  { name:'Uranus', color:0x8fd4d8, size:4.6, dist:145, period:30688, rot:-0.72, tilt:97.8,
    type:'Ice giant', realDist:19.19,
    facts:'Tipped 98° — it essentially rolls around the Sun on its side. Likely knocked over by a massive impact billions of years ago.',
    stats:{ 'Diameter':'50,724 km','Day length':'17.2 hours (retrograde)','Year':'84 Earth years','Distance from Sun':'2.87B km (19.2 AU)','Moons':'28 known','Avg temp':'−197 °C' } },
  { name:'Neptune', color:0x4466dd, size:4.5, dist:170, period:60182, rot:0.67, tilt:28.3,
    type:'Ice giant', realDist:30.07,
    facts:'The windiest planet — gusts reach 2,100 km/h, nearly 5× sound speed. It was the first planet found by mathematical prediction, not observation.',
    stats:{ 'Diameter':'49,244 km','Day length':'16.1 hours','Year':'164.8 Earth years','Distance from Sun':'4.50B km (30.1 AU)','Moons':'16 known','Avg temp':'−201 °C' } },
];

const SUN_DATA = {
  name:'Sun', type:'G2V Yellow Dwarf Star',
  stats:{ 'Diameter':'1,391,000 km','Rotation':'~27 days','Age':'4.6 billion years','Surface temp':'5,505 °C','Core temp':'15M °C','Mass':'99.86% of solar system' },
  facts:'Every second the Sun fuses ~600 million tons of hydrogen into helium, converting 4 million tons of pure mass into the light and heat that power life on Earth.'
};

// ============ BUILD PLANETS ============
const planets = [], orbitLines = [], labels = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickables = [sun];
let startAngle = {};
const EPOCH = Date.UTC(2000, 0, 1); // J2000.0 reference
const epochNow = Date.now();

function makeLabel(text, size = 42) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `${size}px 'Segoe UI', sans-serif`;
  const w = ctx.measureText(text).width + 30;
  c.width = w; c.height = size + 20;
  ctx.font = `${size}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = 'rgba(200,225,255,0.9)';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
  ctx.fillText(text, 15, size);
  const m = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false
  }));
  m.scale.set(w/30, (size+20)/30, 1);
  return m;
}

PLANETS.forEach(p => {
  const pivot = new THREE.Group();
  const tiltGroup = new THREE.Group();
  tiltGroup.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  pivot.add(tiltGroup);

  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.05 });
  // add subtle banding variation via vertex-like shading: use a second tone material overlay
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 40, 40), mat);
  tiltGroup.add(mesh);

  if (p.ring) {
    const rg = new THREE.RingGeometry(p.size*1.4, p.size*2.3, 64);
    // fix UVs so ring gradient works
    const pos2 = rg.attributes.position, uv = rg.attributes.uv, v = new THREE.Vector3();
    for (let i = 0; i < pos2.count; i++) {
      v.fromBufferAttribute(pos2, i);
      uv.setXY(i, (v.length() - p.size*1.4) / (p.size*0.9), 0.5);
    }
    const rc = document.createElement('canvas'); rc.width = 256; rc.height = 8;
    const rctx = rc.getContext('2d');
    const grad = rctx.createLinearGradient(0,0,256,0);
    grad.addColorStop(0, 'rgba(180,160,120,0)');
    grad.addColorStop(0.15, 'rgba(210,190,150,0.8)');
    grad.addColorStop(0.5, 'rgba(240,225,190,0.95)');
    grad.addColorStop(0.55, 'rgba(120,110,90,0.15)');
    grad.addColorStop(0.7, 'rgba(200,185,150,0.7)');
    grad.addColorStop(1, 'rgba(160,145,115,0)');
    rctx.fillStyle = grad; rctx.fillRect(0,0,256,8);
    const ring = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(rc), side: THREE.DoubleSide, transparent: true
    }));
    ring.rotation.x = Math.PI/2;
    tiltGroup.add(ring);
  }

  let moonRef = null;
  if (p.moon) {
    const moonPivot = new THREE.Group();
    const moon = new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xbbbbcc, roughness: 1 }));
    moon.position.x = 5.5;
    moonPivot.add(moon);
    tiltGroup.add(moonPivot);
    p.moonPivot = moonPivot;
  }

  const label = makeLabel(p.name);
  label.position.y = p.size + 4;
  pivot.add(label);
  labels.push(label);

  // orbit line
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = i/128 * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a)*p.dist, 0, Math.sin(a)*p.dist));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.35 })
  );
  scene.add(line);
  orbitLines.push(line);

  scene.add(pivot);
  p.pivot = pivot; p.mesh = mesh;
  p.startAngle = Math.random() * Math.PI * 2;
  planets.push(p);
  clickables.push(mesh);
});

// ============ STATE / UI ============
let paused = false;
let simDays = 0;
let followTarget = null;
let prevFollowPos = new THREE.Vector3();
let realDist = false;

const $ = id => document.getElementById(id);
const speedSlider = $('speedSlider');

function speedLabel() {
  const daysPerSec = Math.pow(10, parseFloat(speedSlider.value));
  if (daysPerSec < 1) return `${(daysPerSec*24).toFixed(1)} h/s`;
  if (daysPerSec < 100) return `${daysPerSec.toFixed(1)} d/s`;
  if (daysPerSec < 3650) return `${(daysPerSec/365.25).toFixed(1)} yr/s`;
  return `${(daysPerSec/36525).toFixed(1)} kyr/s`;
}
$('speedVal').textContent = speedLabel();
speedSlider.addEventListener('input', () => $('speedVal').textContent = speedLabel());

$('pauseBtn').onclick = () => {
  paused = !paused;
  $('pauseBtn').textContent = paused ? '▶ Play' : '⏸ Pause';
};
$('orbitsBtn').onclick = e => {
  orbitLines.forEach(l => l.visible = !l.visible);
  e.target.classList.toggle('active');
};
$('labelsBtn').onclick = e => {
  labels.forEach(l => l.visible = !l.visible);
  e.target.classList.toggle('active');
};
$('resetBtn').onclick = () => {
  followTarget = null;
  $('infoPanel').classList.remove('open');
  camera.position.set(0, 90, 190);
  controls.target.set(0,0,0);
};

$('realScaleBtn').onclick = e => {
  realDist = !realDist;
  e.target.classList.toggle('active', realDist);
  e.target.textContent = realDist ? 'Compressed view' : 'Real distances';
  planets.forEach(p => {
    const d = realDist ? p.realDist * 90 : p.dist;
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = i/128 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a)*d, 0, Math.sin(a)*d));
    }
    p.orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
    // replace orbit line geometry
    orbitLines[planets.indexOf(p)].geometry.dispose();
    orbitLines[planets.indexOf(p)].geometry = p.orbitGeo;
    p.dist = d;
    if (followTarget === p) followTarget = null;
  });
  if (realDist) camera.position.set(0, 250, 600);
};

$('followBtn').onclick = () => {
  if (currentInfo && currentInfo !== SUN_DATA) followTarget = currentInfo.planetRef;
};
$('infoClose').onclick = () => $('infoPanel').classList.remove('open');

// ============ INFO PANEL ============
let currentInfo = null;
function showInfo(data) {
  currentInfo = data;
  $('infoName').textContent = data.name;
  $('infoType').textContent = data.type;
  $('infoStats').innerHTML = Object.entries(data.stats)
    .map(([k,v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  $('infoFacts').textContent = data.facts;
  $('infoPanel').classList.add('open');
}

// ============ CLICK HANDLING ============
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return; // was a drag
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables);
  if (hits.length) {
    const obj = hits[0].object;
    if (obj === sun) { showInfo(SUN_DATA); followTarget = null; }
    else {
      const p = planets.find(pl => pl.mesh === obj);
      p._data = { ...PLANETS[planets.indexOf(p)] };
      showInfo({ ...PLANETS[planets.indexOf(p)], planetRef: p });
      followTarget = p;
    }
    $('hint').style.opacity = 0;
  } else {
    $('infoPanel').classList.remove('open');
  }
});

// ============ ANIMATE ============
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (!paused) {
    simDays += Math.pow(10, parseFloat(speedSlider.value)) * dt;

    planets.forEach(p => {
      const angle = p.startAngle + (simDays / p.period) * Math.PI * 2;
      p.pivot.position.set(Math.cos(angle)*p.dist, 0, Math.sin(angle)*p.dist);
      p.mesh.rotation.y = (simDays / p.rot) * Math.PI * 2;
      if (p.moonPivot) p.moonPivot.rotation.y = (simDays / 27.3) * Math.PI * 2;
    });
    sun.rotation.y += dt * 0.05;
  }

  // follow camera
  if (followTarget) {
    followTarget.pivot.getWorldPosition(tmpV);
    const delta = tmpV.clone().sub(prevFollowPos);
    camera.position.add(delta);
    controls.target.lerp(tmpV, 0.15);
    prevFollowPos.copy(tmpV);
  } else {
    prevFollowPos.set(0,0,0);
    controls.target.lerp(new THREE.Vector3(0,0,0), 0.02);
  }

  // date display
  const d = new Date(EPOCH + simDays * 86400000);
  $('dateDisplay').textContent =
    `${d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} — J2000 + ${
      simDays >= 36525 ? (simDays/36525).toFixed(2)+' kyr' :
      simDays >= 365 ? (simDays/365.25).toFixed(1)+' yr' :
      simDays.toFixed(1)+' days'
    }`;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

showInfo({ ...PLANETS[2], planetRef: planets[2] }); // welcome: Earth
$('infoPanel').classList.remove('open');
</script>
</body>
</html>
